openapi: 3.1.0
info:
  title: Ticket Management API - Ticket Lifecycle
  version: 0.1.0
  description: |
    REST contract for feature 001-ticket-lifecycle.

    Error model (RFC 9457 problem details, `application/problem+json`). Every error carries a stable `errorCode`:
    - 400 `MALFORMED_REQUEST` / `VALIDATION_FAILED`: the request itself is bad.
    - 404 `TICKET_NOT_FOUND`: the ticket does not exist.
    - 409 `INVALID_TRANSITION` / `TICKET_FROZEN` / `RESOLUTION_NOTES_NOT_EDITABLE`: the request is well formed, but the ticket's current state forbids it.
    - 503 `TICKET_BUSY`: the ticket is held by another in-progress change longer than the configured wait (spec edge case). The response includes a `Retry-After` header (retry later). The ticket is unchanged and no refresh intent is recorded. This is a fourth outcome, distinct from badly formed input, a disallowed move, and a missing ticket.

    Order of checks: boundary validation (400), then ticket lookup (404), then state rules (409).

    Request bodies reject unknown fields (400 `MALFORMED_REQUEST`).
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Tickets
paths:
  /api/tickets:
    post:
      tags: [Tickets]
      operationId: createTicket
      summary: Create a ticket (status OPEN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created. A refresh intent was recorded in the same transaction.
          headers:
            Location:
              description: URL of the new ticket
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Tickets]
      operationId: listTickets
      summary: List or search tickets
      description: |
        Newest `updatedAt` first (ties broken by identifier, descending). Fixed page size of 20.
        `q` is trimmed. A blank `q` means no keyword filter. A ticket matches `q` when `q` occurs (case-insensitive,
        literal characters) in title, description, category, resolution notes, assignee, or any comment text,
        or when the trimmed `q` equals the ticket identifier (`TKT-1001`, case-insensitive; `1001` does not match).
        Cancellation reason is not searched. `q` and `status` combine with AND. No match gives an empty `items`.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: page
          in: query
          required: false
          description: Zero-based page index. Negative or non-integer is a 400.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: One page of matching tickets (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: View one ticket with all its comments
      responses:
        '200':
          description: The ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Tickets]
      operationId: editTicket
      summary: Edit ticket fields (never status)
      description: |
        JSON Merge Patch (RFC 7396). An absent field is unchanged. An explicit null clears, and only `assignee` may be cleared. Null on `title`, `description`, `priority`, or `category` is 400 `VALIDATION_FAILED`. A blank `assignee` string does not clear the assignee.
        At least one editable field must be present. `status`, `id`, `createdAt`, and `comments` are unknown here and are rejected.
        `resolutionNotes` may be supplied only when the ticket already has resolution notes, and can never be blank.
        Refused with 409 `TICKET_FROZEN` when the ticket is CLOSED or CANCELLED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditTicketRequest'
      responses:
        '200':
          description: Edit accepted. `updatedAt` changed and a refresh intent was recorded in the same transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The ticket's state forbids the edit. `errorCode` is `TICKET_FROZEN` (CLOSED or CANCELLED)
            or `RESOLUTION_NOTES_NOT_EDITABLE` (notes supplied while the ticket has none).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StateProblem'
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets/{ticketId}/transitions:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Tickets]
      operationId: transitionTicket
      summary: Move a ticket to another status
      description: |
        Allowed moves: OPEN to IN_PROGRESS, IN_PROGRESS to RESOLVED, RESOLVED to CLOSED, OPEN to CANCELLED,
        IN_PROGRESS to CANCELLED. Any other move (including to the current status) is a 409 `INVALID_TRANSITION`
        that reports `currentStatus` and `allowedTransitions`.

        `resolutionNotes` is required (non-blank) when `status` is RESOLVED and must not be sent otherwise.
        `cancellationReason` is required (non-blank) when `status` is CANCELLED and must not be sent otherwise.
        A `status` value outside the five known statuses is a 400, not a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Move accepted. A refresh intent was recorded in the same transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The ticket cannot move to that status from its current status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidTransitionProblem'
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets/{ticketId}/comments:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Tickets]
      operationId: addComment
      summary: Add a comment (allowed in every status, including CLOSED and CANCELLED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentRequest'
      responses:
        '201':
          description: Comment saved. The ticket's `updatedAt` changed and a refresh intent was recorded in the same transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      description: Ticket identifier in canonical form `TKT-<n>`. Any other form is reported as not found.
      schema:
        type: string
        pattern: '^TKT-[1-9][0-9]*$'
        examples: [TKT-1001]
  schemas:
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
    Category:
      type: string
      enum: [BILLING, TECHNICAL, ACCOUNT, SHIPPING, OTHER]
    CreateTicketRequest:
      type: object
      additionalProperties: false
      required: [title, description, priority, category]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Must not be blank.
        description:
          type: string
          minLength: 1
          maxLength: 5000
          description: Must not be blank.
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/Category'
        assignee:
          type: [string, 'null']
          maxLength: 100
          description: Optional. Blank is stored as no assignee.
    EditTicketRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 200
          description: Null is 400 VALIDATION_FAILED.
        description:
          type: string
          maxLength: 5000
          description: Null is 400 VALIDATION_FAILED.
        priority:
          description: Null is 400 VALIDATION_FAILED.
          $ref: '#/components/schemas/Priority'
        category:
          description: Null is 400 VALIDATION_FAILED.
          $ref: '#/components/schemas/Category'
        assignee:
          type: [string, 'null']
          maxLength: 100
          description: Absent leaves the assignee unchanged. Explicit null clears it. A blank string does not clear it.
        resolutionNotes:
          type: string
          maxLength: 5000
          description: Replaces existing notes. Must not be blank. Refused while the ticket has no notes.
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          description: Target status. Must be one of the five known statuses (400 otherwise).
          enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
        resolutionNotes:
          type: string
          maxLength: 5000
          description: Required and non-blank when status is RESOLVED; rejected otherwise.
        cancellationReason:
          type: string
          maxLength: 5000
          description: Required and non-blank when status is CANCELLED; rejected otherwise.
    AddCommentRequest:
      type: object
      additionalProperties: false
      required: [author, text]
      properties:
        author:
          type: string
          minLength: 1
          maxLength: 100
          description: Must not be blank.
        text:
          type: string
          minLength: 1
          maxLength: 5000
          description: Must not be blank.
    Comment:
      type: object
      required: [author, text, createdAt]
      properties:
        author:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    Ticket:
      type: object
      required: [id, title, description, priority, category, status, createdAt, updatedAt, comments]
      properties:
        id:
          type: string
          examples: [TKT-1001]
        title:
          type: string
        description:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/Category'
        assignee:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TicketStatus'
        resolutionNotes:
          type: [string, 'null']
          description: Null until the ticket is resolved.
        cancellationReason:
          type: [string, 'null']
          description: Null unless the ticket is cancelled.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        comments:
          type: array
          description: Oldest first.
          items:
            $ref: '#/components/schemas/Comment'
    TicketSummary:
      type: object
      required: [id, title, priority, category, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/Category'
        assignee:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TicketStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TicketPage:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        page:
          type: integer
          minimum: 0
        pageSize:
          type: integer
          const: 20
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Name of the offending request field or query parameter.
        code:
          type: string
          description: 'Stable per-field reason, for example BLANK, TOO_LONG, NOT_ALLOWED, REQUIRED, UNKNOWN_FIELD, NOT_APPLICABLE.'
        message:
          type: string
        allowedValues:
          type: array
          items:
            type: string
          description: Present when the field accepts a fixed set of values.
    Problem:
      type: object
      description: RFC 9457 problem details plus the stable `errorCode` extension.
      required: [type, title, status, errorCode]
      properties:
        type:
          type: string
          const: 'about:blank'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errorCode:
          type: string
          enum:
            - MALFORMED_REQUEST
            - VALIDATION_FAILED
            - TICKET_NOT_FOUND
            - RESOURCE_NOT_FOUND
            - INVALID_TRANSITION
            - TICKET_FROZEN
            - RESOLUTION_NOTES_NOT_EDITABLE
            - TICKET_BUSY
            - METHOD_NOT_ALLOWED
            - UNSUPPORTED_MEDIA_TYPE
            - INTERNAL_ERROR
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              description: Every failing field in the request, not only the first.
              items:
                $ref: '#/components/schemas/FieldError'
    InvalidTransitionProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [currentStatus, allowedTransitions]
          properties:
            currentStatus:
              $ref: '#/components/schemas/TicketStatus'
            allowedTransitions:
              type: array
              description: Empty for CLOSED and CANCELLED.
              items:
                $ref: '#/components/schemas/TicketStatus'
    StateProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [currentStatus]
          properties:
            currentStatus:
              $ref: '#/components/schemas/TicketStatus'
  responses:
    BadRequest:
      description: Malformed request or failed field validation (`MALFORMED_REQUEST` or `VALIDATION_FAILED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    NotFound:
      description: No such ticket (`TICKET_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Busy:
      description: |
        Ticket held by another in-progress change longer than the configured wait (`TICKET_BUSY`).
        Spec edge case: temporarily unavailable, with guidance to retry later. The ticket is unchanged and no refresh intent is recorded.
        A fourth outcome, distinct from badly formed input, a disallowed move, and a missing ticket.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          required: true
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected failure (`INTERNAL_ERROR`). No internal details are returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
